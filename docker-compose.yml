services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      tags:
        - sleep-help-backend:1.1.0
        - sleep-help-backend:latest
    ports:
      - "3001:3001"
    container_name: sleep-help-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    # Carrega variáveis do arquivo .env (WHATSAPP_PHONE, WHATSAPP_API_KEY, ALARM_THRESHOLD)
    env_file:
      - ./backend/.env
    # Volumes para atualização automática (descomente para desenvolvimento)
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    networks:
      - sleep-help-network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - sleep-help-frontend:1.1.0
        - sleep-help-frontend:latest
    ports:
      - "3000:80"
    container_name: sleep-help-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Volumes para atualização automática (descomente para desenvolvimento)
    # volumes:
    #   - ./src:/app/src
    #   - ./public:/app/public
    networks:
      - sleep-help-network

networks:
  sleep-help-network:
    driver: bridge