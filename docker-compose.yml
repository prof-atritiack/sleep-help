services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      tags:
        - sleep-help-backend:1.1.0
        - sleep-help-backend:latest
    ports:
      - "3001:3001"
    container_name: sleep-help-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Variáveis do WhatsApp (configure no .env ou aqui)
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
      - ALARM_THRESHOLD=${ALARM_THRESHOLD:-95}
    # Permite passar variáveis do arquivo .env do host
    env_file:
      - ./backend/.env
    networks:
      - sleep-help-network

  # Frontend React
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - sleep-help-frontend:1.1.0
        - sleep-help-frontend:latest
    ports:
      - "3000:80"
    container_name: sleep-help-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - sleep-help-network

networks:
  sleep-help-network:
    driver: bridge